# courier-call configuration. Plain `key = value`, one per line;
# `#` starts a comment. String values may use \r \n \t escapes.
#
# OVERRIDE ORDER (highest first): CLI options (--mode, --duration, --out)
#   > this file > environment variables (only for keys absent here)
#   > the selected profile's built-in defaults (src/glue/config.c).
# Env vars are never required; this file is the source of truth.
#
# FIRMWARE SOURCE OF TRUTH
#   The firmware comes from SV25.XMD, the USRobotics Courier V.Everything
#   flash-update file (524,416 bytes, SHA-256
#   43503d82caae5377d67c61f4f44d73e6a19e15c61b2cb706a70c6f1b88ef413f),
#   canonical path:
#     ~/workspace/research_notes/courier-firmware/SV25.XMD
#   It is NOT loaded directly. It is decoded with the existing decode path
#   (rolling-XOR decode, flash addr = file offset + 0x80):
#     python3 ~/workspace/research_notes/courier-firmware/handover-2-2026-11-15/handover/tools/sv25_decode.py SV25.XMD fw/SV25.flash.bin
#   which produces a 524,288-byte image, SHA-256
#   f24633ab12c21c3cef93c0f6c0bb8150021b0056953cb5517a95932abc673c52.
#   `make fw` runs exactly that decode (XMD path overridable with
#   `make fw XMD=/path/to/SV25.XMD`); `make run` depends on it, so a clean
#   checkout produces its flash from the XMD. Never patch the firmware,
#   never upload/publish the XMD, the decoded flash, or audio anywhere.
#   The `flash` key below names the DECODED image `make fw` produces.
#   `xmd` (optional) records the XMD this flash was decoded from.
xmd = SV25.XMD

# --- profile / firmware ---
# sv25 (default): US/Canada SV25 image, cpu 25.8048 MHz, iface 25,
# dsp_base_bytes 55420, isr_presets, nvram.bin.
# (flash + nvram paths below must then point at the matching images).
profile = sv25
flash = fw/SV25.flash.bin
nvram = fw/nvram.bin
# DSP base image on disk (informational: start_dsp uses the supervisor's
# captured download bursts, not this file; kept so the image is present).
dsp_base = fw/dsp_base.bin

# --- the call ---
duration_seconds = 40
mode = auto          # auto | v21 | v22 | echo | gate (as in linkcall.py)
phone = 1
# AT setup strings, '|' separated; \r is the carriage return.
setup_a = AT\r|ATQ0V1S0=1\r
setup_b = AT\r|ATQ0V1\r
# Optional user payload sent once from the caller after CONNECT.
# Default: none — just AT setup + dial, matching linkcall.py.
send_text = Hello world from courier
# Answerer (A) message, sent after A reports CONNECT.
send_text_a = Hello back from the answerer
send_file =

# --- line / link ---
noise_amp = 8        # peak line-noise amplitude in DRR units (0 = silence)
link_slice = 1000    # CPU cycles per lockstep slice (shared absolute clock)
line8k = 0           # route each direction through the 8 kHz PCM line
gate = 0             # mute A->B between A cmd 0x21 and B cmd 0x20
echo = 0.0           # hybrid leakage of a side's own transmit into its receive
gain = 0.5           # line gain (Link.gain; call_data.py GAIN env). Default 1.0
                     # = the zip baseline (verified: stalls at 02 B000, NO CARRIER).
                     # 0.5 is the fable-progress §62/§64 operating point that
                     # connects (CONNECT 18.5 s, 10 clean bytes each way);
                     # 1.0 overloads the receiver (+6 dB net with codec gain)
                     # and the handshake never starts (§31: "Use GAIN 0.5 as
                     # the default line loss from now on"; §62/§64). Keep 1.0
                     # here until Hrvoje approves switching the default.
delay_samples = 0    # extra one-way line delay, in codec samples
dial_dwell = 0.5     # seconds between end of dialled digit and ring voltage
ring_on = 1.0        # seconds of ring voltage per cadence period
ring_period = 2.0    # ring cadence period, seconds

# --- outputs ---
wav_rate = 22050     # WAV sample rate (link.py write_wav resamples per segment)
wav = out/call_auto.wav   # exactly ONE wav file: stereo, left = caller B, right = answerer A
log_dir = out

# --- experiment toggles machine.py read from env ---
# (Only the keys listed here; unset keys fall back to env, then defaults.)
xint_mode = 1
cycle_model = 1
legacy = 0
tdm_irqs = 0
ac01_model = 1
sec_frame = 1
hb_timer = 1
dsp_clk_fixed = 1
port_rb = 1
int23 = 1
ac01_filt = 0
ac01_lat = 0
cmd_ovr =
ac01_clamp =
p51div = 0
cpu_scale = 1.0
ud_trap = 1
cpu_model = 1
# cpu_hz / dsp_hz: unset = profile values (sv25: 25804800 / 40320000).
# patch_crc: 0x1735 = the SDL-written boot CRC default; -1 = do not patch.
patch_crc = 0x1735
# nvram_mode: -1 = none (Link machines, as in link.py); 6 = direct-Machine default.
nvram_mode = -1
fax_patch = 0
cmpr = 0
tintslot = -1
dsp_rom =
bankwr = 1
# hw_idx: -1 = profile value (sv25: 7).
hw_idx = -1
voice_data_button = 0
boot_cycles = 150000000
setup_cycles = 10000000
