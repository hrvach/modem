<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 68 1400 240" width="1400" height="240" role="img" aria-labelledby="title desc">
  <title id="title">Carrier V.Something modem, front panel</title>
  <desc id="desc">Front elevation of an external modem. Black case with a brushed finish, corner screws, a vent grille, a long red LED window with 12 indicators (HS, AA, CD, OH, RD, SD, TR, MR, RS, CS, SYN, ARQ/FAX), a DATA/VOICE button, and CARRIER V.SOMETHING branding. MR and CS are shown lit, the powered-on idle state.</desc>
  <defs>
    <linearGradient id="caseGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#686b68"/>
      <stop offset="0.1" stop-color="#585b58"/>
      <stop offset="1" stop-color="#434543"/>
    </linearGradient>
    <pattern id="brushed" width="6" height="3" patternUnits="userSpaceOnUse">
      <rect width="6" height="1" fill="#ffffff" opacity="0.035"/>
    </pattern>
    <linearGradient id="panelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4d4a"/>
      <stop offset="1" stop-color="#363936"/>
    </linearGradient>
    <radialGradient id="screwGrad" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#9a9a9a"/>
      <stop offset="0.55" stop-color="#4a4a4a"/>
      <stop offset="1" stop-color="#1c1c1c"/>
    </radialGradient>
    <linearGradient id="ledOff" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5e1010"/>
      <stop offset="1" stop-color="#4c0c0c"/>
    </linearGradient>
    <linearGradient id="ledOn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff5440"/>
      <stop offset="1" stop-color="#ee2a16"/>
    </linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.09"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="btnGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#585b58"/>
      <stop offset="1" stop-color="#4a4d4a"/>
    </linearGradient>
    <!-- the lit lamps: a tight bright halo plus a wide soft one (the page sets filter="url(#glow)" on lit lamps) -->
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="tight"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="wide"/>
      <feMerge>
        <feMergeNode in="wide"/>
        <feMergeNode in="tight"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- outer case: brushed metal, a lit top edge, a dark bottom edge -->
  <rect x="8" y="76" width="1384" height="224" rx="14" fill="url(#caseGrad)" stroke="#505050" stroke-width="1.5"/>
  <rect x="8" y="76" width="1384" height="224" rx="14" fill="url(#brushed)"/>
  <rect x="16" y="77.5" width="1368" height="1.6" rx="0.8" fill="#ffffff" opacity="0.2"/>
  <rect x="16" y="297" width="1368" height="1.6" rx="0.8" fill="#000000" opacity="0.55"/>

  <!-- front panel inset -->
  <rect x="28" y="96" width="1344" height="184" rx="8" fill="url(#panelGrad)" stroke="#5a5d5a" stroke-width="2"/>
  <rect x="32" y="100" width="1336" height="176" rx="6" fill="none" stroke="#000000" stroke-width="1" opacity="0.6"/>

  <!-- top row: 56 Kbps Technology + dotted red rule -->
  <text x="48" y="133" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="600" fill="#e6e6e6">56 Kbps Technology</text>
  <line x1="278" y1="127" x2="1352" y2="127" stroke="#c81e1e" stroke-width="3" stroke-dasharray="1 7" stroke-linecap="round"/>

  <!-- LED window: a bezel, the dark red window, 12 lamps (the page drives these twelve rects), dividers, lens shine -->
  <rect x="145" y="143" width="870" height="76" rx="6" fill="#0c0c0c" stroke="#2e2e2e" stroke-width="1.5"/>
  <rect x="150" y="148" width="860" height="66" rx="3" fill="#2a0202" stroke="#140000" stroke-width="1.5"/>
  <!-- 12 segments, 71.67 px pitch. Lit: MR (index 7) and CS (index 9), the powered-on idle state -->
  <g>
    <rect x="154" y="152" width="64" height="58" rx="2" fill="url(#ledOff)"/>
    <rect x="226" y="152" width="64" height="58" rx="2" fill="url(#ledOff)"/>
    <rect x="297" y="152" width="64" height="58" rx="2" fill="url(#ledOff)"/>
    <rect x="369" y="152" width="64" height="58" rx="2" fill="url(#ledOff)"/>
    <rect x="441" y="152" width="64" height="58" rx="2" fill="url(#ledOff)"/>
    <rect x="512" y="152" width="64" height="58" rx="2" fill="url(#ledOff)"/>
    <rect x="584" y="152" width="64" height="58" rx="2" fill="url(#ledOff)"/>
    <rect x="656" y="152" width="64" height="58" rx="2" fill="url(#ledOn)" filter="url(#glow)"/>
    <rect x="727" y="152" width="64" height="58" rx="2" fill="url(#ledOff)"/>
    <rect x="799" y="152" width="64" height="58" rx="2" fill="url(#ledOn)" filter="url(#glow)"/>
    <rect x="871" y="152" width="64" height="58" rx="2" fill="url(#ledOff)"/>
    <rect x="942" y="152" width="64" height="58" rx="2" fill="url(#ledOff)"/>
  </g>
  <g fill="url(#lens)" pointer-events="none">
    <rect x="154" y="152" width="64" height="58" rx="2"/><rect x="226" y="152" width="64" height="58" rx="2"/>
    <rect x="297" y="152" width="64" height="58" rx="2"/><rect x="369" y="152" width="64" height="58" rx="2"/>
    <rect x="441" y="152" width="64" height="58" rx="2"/><rect x="512" y="152" width="64" height="58" rx="2"/>
    <rect x="584" y="152" width="64" height="58" rx="2"/><rect x="656" y="152" width="64" height="58" rx="2"/>
    <rect x="727" y="152" width="64" height="58" rx="2"/><rect x="799" y="152" width="64" height="58" rx="2"/>
    <rect x="871" y="152" width="64" height="58" rx="2"/><rect x="942" y="152" width="64" height="58" rx="2"/>
  </g>
  <!-- segment dividers -->
  <g stroke="#1c0000" stroke-width="2">
    <line x1="222" y1="152" x2="222" y2="210"/><line x1="293" y1="152" x2="293" y2="210"/>
    <line x1="365" y1="152" x2="365" y2="210"/><line x1="437" y1="152" x2="437" y2="210"/>
    <line x1="508" y1="152" x2="508" y2="210"/><line x1="580" y1="152" x2="580" y2="210"/>
    <line x1="652" y1="152" x2="652" y2="210"/><line x1="723" y1="152" x2="723" y2="210"/>
    <line x1="795" y1="152" x2="795" y2="210"/><line x1="867" y1="152" x2="867" y2="210"/>
    <line x1="938" y1="152" x2="938" y2="210"/>
  </g>

  <!-- LED labels, centred under their lamps -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600" fill="#d8d8d8" text-anchor="middle" letter-spacing="0.6">
    <text x="186" y="244">HS</text>
    <text x="258" y="244">AA</text>
    <text x="329" y="244">CD</text>
    <text x="401" y="244">OH</text>
    <text x="473" y="244">RD</text>
    <text x="544" y="244">SD</text>
    <text x="616" y="244">TR</text>
    <text x="688" y="244">MR</text>
    <text x="759" y="244">RS</text>
    <text x="831" y="244">CS</text>
    <text x="903" y="244">SYN</text>
    <text x="974" y="244" font-size="16" letter-spacing="0">ARQ/FAX</text>
  </g>

  <!-- DATA/VOICE button in a recess -->
  <rect x="1046" y="142" width="124" height="78" rx="12" fill="#2c2f2c" stroke="#454845" stroke-width="1.5"/>
  <rect x="1052" y="148" width="112" height="66" rx="8" fill="url(#btnGrad)" stroke="#6e716e" stroke-width="1.5"/>
  <text x="1108" y="244" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" fill="#d8d8d8" letter-spacing="1">DATA/VOICE</text>

  <!-- CARRIER V.SOMETHING -->
  <text x="1198" y="206" font-family="'Arial Narrow', Arial, Helvetica, sans-serif" font-size="46" font-weight="800" fill="#f2f2f2" textLength="152" lengthAdjust="spacingAndGlyphs">CARRIER</text>
  <text x="1352" y="176" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#dddddd">™</text>
  <text x="1198" y="240" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#d92121" letter-spacing="1.5">V.SOMETHING</text>
</svg>
